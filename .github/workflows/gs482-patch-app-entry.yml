name: GS482 patch app entry

on:
  push:
    branches:
      - codex/gs482-app-entry-live-evidence

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/gs482-app-entry-live-evidence
      - name: Patch app entry and remove one-shot workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app.py")
          text = path.read_text(encoding="utf-8")
          needle = 'log_startup("entering app.py")\n'
          addition = '''\n# GS482: Streamlit re-executes app.py even when imported MIDE modules survive a\n# warm deploy. Reassert GS481 from this hard boundary so its news/stream-failure\n# evidence reaches the retained Flight Recorder graph. Observability only.\nfrom mide.gs481_live_evidence_hard_bind import install as _install_gs481_live_evidence\n_install_gs481_live_evidence()\n'''
          if addition.strip() not in text:
              if needle not in text:
                  raise SystemExit("app entry marker not found")
              text = text.replace(needle, needle + addition, 1)
              path.write_text(text, encoding="utf-8")
          PY
          git rm .github/workflows/gs482-patch-app-entry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "GS482: hard-bind live evidence at app entry"
          git push
