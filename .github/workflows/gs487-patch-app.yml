name: GS487 patch app

on:
  push:
    branches: [codex/gs487-cached-recorder-instance-bind]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/gs487-cached-recorder-instance-bind
      - name: Patch record_scan_safely hard boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app.py')
          text = path.read_text()
          anchor = '''    try:\n        try:\n            result = recorder.record_scan(\n'''
          addition = '''    try:\n        binder = importlib.import_module("mide.gs487_cached_recorder_instance_bind")\n        installed_now = bool(binder.install_for_recorder(recorder))\n        diagnostics["gs487_cached_recorder_instance_bind"] = {\n            "installed_now": installed_now,\n            "error": None,\n        }\n    except Exception as exc:\n        diagnostics["gs487_cached_recorder_instance_bind"] = {\n            "installed_now": False,\n            "error": type(exc).__name__,\n        }\n\n    try:\n        try:\n            result = recorder.record_scan(\n'''
          if 'binder.install_for_recorder(recorder)' not in text:
              if anchor not in text:
                  raise SystemExit('record_scan_safely anchor missing')
              text = text.replace(anchor, addition, 1)
          path.write_text(text)
          PY
      - name: Commit app hard bind
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m "GS487: bind cached recorder immediately before write"
          git push origin HEAD:codex/gs487-cached-recorder-instance-bind
