name: GS487 adjust app

on:
  push:
    branches: [codex/gs487-cached-recorder-instance-bind]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/gs487-cached-recorder-instance-bind
      - name: Preserve recorder diagnostics contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app.py')
          text = path.read_text()
          old = '''    try:\n        binder = importlib.import_module("mide.gs487_cached_recorder_instance_bind")\n        installed_now = bool(binder.install_for_recorder(recorder))\n        diagnostics["gs487_cached_recorder_instance_bind"] = {\n            "installed_now": installed_now,\n            "error": None,\n        }\n    except Exception as exc:\n        diagnostics["gs487_cached_recorder_instance_bind"] = {\n            "installed_now": False,\n            "error": type(exc).__name__,\n        }\n\n'''
          new = '''    try:\n        binder = importlib.import_module("mide.gs487_cached_recorder_instance_bind")\n        binder.install_for_recorder(recorder)\n    except Exception as exc:\n        logging.getLogger(__name__).warning(\n            "Flight Recorder GS487 cached-instance bind skipped (%s)",\n            type(exc).__name__,\n        )\n\n'''
          if old not in text:
              raise SystemExit('GS487 app block missing')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit diagnostics-contract correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m "GS487: preserve record_scan_safely diagnostics contract"
          git push origin HEAD:codex/gs487-cached-recorder-instance-bind
