name: GS488 patch installer

on:
  push:
    branches: [codex/gs488-webull-connection-limit-backoff]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/gs488-webull-connection-limit-backoff
      - name: Add GS488 to late runtime installer
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('mide/gs384_diagnostic_signal_to_noise.py')
          text = path.read_text()
          import_anchor = '    from .gs470_30s_activation_truth import install as install_gs470\n'
          import_add = import_anchor + '    from .gs488_webull_connection_limit_backoff import install as install_gs488\n'
          call_anchor = '    install_gs470()\n    install_gs473()\n'
          call_add = '    install_gs470()\n    install_gs488()\n    install_gs473()\n'
          if 'install as install_gs488' not in text:
              if import_anchor not in text:
                  raise SystemExit('GS470 import anchor missing')
              text = text.replace(import_anchor, import_add, 1)
          if '    install_gs488()\n' not in text:
              if call_anchor not in text:
                  raise SystemExit('GS470/GS473 call anchor missing')
              text = text.replace(call_anchor, call_add, 1)
          path.write_text(text)
          PY
      - name: Commit installer integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mide/gs384_diagnostic_signal_to_noise.py
          git diff --cached --quiet && exit 0
          git commit -m "GS488: install connection-limit containment at runtime boundary"
          git push origin HEAD:codex/gs488-webull-connection-limit-backoff
