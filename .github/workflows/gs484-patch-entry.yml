name: GS484 patch entry

on:
  push:
    branches: [codex/gs484-fmp-transport-truth]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/gs484-fmp-transport-truth
      - name: Patch app and startup installers
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('app.py')
          text = app.read_text()
          anchor = 'from mide.gs481_live_evidence_hard_bind import install as _install_gs481_live_evidence\n_install_gs481_live_evidence()\n'
          addition = anchor + 'from mide.gs484_fmp_transport_truth import install as _install_gs484_fmp_transport_truth\n_install_gs484_fmp_transport_truth()\n'
          if '_install_gs484_fmp_transport_truth()' not in text:
              if anchor not in text:
                  raise SystemExit('app GS481 anchor missing')
              text = text.replace(anchor, addition, 1)
          app.write_text(text)

          startup = Path('mide/startup.py')
          text = startup.read_text()
          import_anchor = '    from .gs481_live_evidence_hard_bind import install as install_gs481\n'
          import_addition = import_anchor + '    from .gs484_fmp_transport_truth import install as install_gs484\n'
          if 'from .gs484_fmp_transport_truth import install as install_gs484' not in text:
              if import_anchor not in text:
                  raise SystemExit('startup GS481 import anchor missing')
              text = text.replace(import_anchor, import_addition, 1)

          call_anchor = '    install_gs481()\n    # GS483 bounds Flight Recorder read-side memory.'
          call_addition = '''    install_gs481()\n    # GS484 reads only the already-populated NewsService metrics from the active\n    # provider and binds sanitized transport provenance into GS481 news truth.\n    install_gs484()\n    # GS483 bounds Flight Recorder read-side memory.'''
          if '    install_gs484()\n' not in text:
              if call_anchor not in text:
                  raise SystemExit('startup GS481 call anchor missing')
              text = text.replace(call_anchor, call_addition, 1)
          startup.write_text(text)
          PY
      - name: Commit installer patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py mide/startup.py
          git diff --cached --quiet && exit 0
          git commit -m "GS484: hard-bind transport truth at app entry"
          git push origin HEAD:codex/gs484-fmp-transport-truth
