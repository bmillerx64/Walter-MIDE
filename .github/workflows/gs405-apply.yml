name: GS405 Apply and Verify

on:
  push:
    branches:
      - gs405-start-to-start-autoscan

permissions:
  contents: write

jobs:
  apply-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout GS405 branch
        uses: actions/checkout@v4
        with:
          ref: gs405-start-to-start-autoscan
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Apply surgical app and regression patch
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path("app.py")
          source = app_path.read_text(encoding="utf-8")

          replacements = [
              (
                  '''    STOP_REQUESTED_KEY,\n    begin_scheduled_scan,\n    finish_scan,\n''',
                  '''    STOP_REQUESTED_KEY,\n    autoscan_request_due,\n    autoscan_wait_seconds,\n    begin_scheduled_scan,\n    finish_scan,\n''',
              ),
              (
                  '''    if enabled:\n        interval = retry_seconds if last_scan_attempt and (\n            not last_updated or last_scan_attempt > last_updated\n        ) else refresh_seconds\n        interval = max(1, int(interval))\n        tick_key = "_walter_live_scan_fragment_tick"\n''',
                  '''    if enabled:\n        interval = autoscan_wait_seconds(\n            refresh_seconds,\n            last_updated,\n            last_scan_attempt,\n            retry_seconds=retry_seconds,\n        )\n        tick_key = "_walter_live_scan_fragment_tick"\n''',
              ),
              (
                  '''            previous = st.session_state.get(tick_key)\n            if previous is None:\n                st.session_state[tick_key] = now\n            elif (now - previous).total_seconds() >= interval * 0.9:\n                st.session_state[tick_key] = now\n                st.rerun(scope="app")\n''',
                  '''            previous = st.session_state.get(tick_key)\n            if previous is not None and last_scan_attempt and previous < last_scan_attempt:\n                previous = None\n            if previous is None:\n                st.session_state[tick_key] = now\n            elif (now - previous).total_seconds() >= interval * 0.9:\n                if autoscan_request_due(\n                    refresh_seconds,\n                    last_updated,\n                    last_scan_attempt,\n                    retry_seconds=retry_seconds,\n                    now=now,\n                ):\n                    st.session_state[SCAN_REQUESTED_KEY] = True\n                st.session_state[tick_key] = now\n                st.rerun(scope="app")\n''',
              ),
              (
                  '''            const deadline = attemptedAt > updatedAt\n              ? attemptedAt + retryMs\n              : (updatedAt ? updatedAt + refreshMs : now);\n''',
                  '''            const deadline = attemptedAt > updatedAt\n              ? attemptedAt + retryMs\n              : (attemptedAt ? attemptedAt + refreshMs : now);\n''',
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"GS405 expected exactly one app.py match, found {count}: {old[:80]!r}")
              source = source.replace(old, new, 1)
          app_path.write_text(source, encoding="utf-8")

          test_path = Path("tests/test_283_autoscan_lifecycle.py")
          tests = test_path.read_text(encoding="utf-8")
          old_import = '''from pathlib import Path\n\nfrom mide.session_controls import (\n'''
          new_import = '''from datetime import datetime, timedelta, timezone\nfrom pathlib import Path\n\nfrom mide.session_controls import (\n'''
          if tests.count(old_import) != 1:
              raise SystemExit("GS405 test datetime import anchor mismatch")
          tests = tests.replace(old_import, new_import, 1)

          old_names = '''    STOP_REQUESTED_KEY,\n    begin_scheduled_scan,\n'''
          new_names = '''    STOP_REQUESTED_KEY,\n    autoscan_request_due,\n    autoscan_wait_seconds,\n    begin_scheduled_scan,\n'''
          if tests.count(old_names) != 1:
              raise SystemExit("GS405 test helper import anchor mismatch")
          tests = tests.replace(old_names, new_names, 1)

          append = r'''


def test_autoscan_success_wait_is_measured_from_scan_start():
    started = datetime(2026, 9, 9, 14, 30, 0, tzinfo=timezone.utc)
    completed = started + timedelta(seconds=55)

    assert autoscan_wait_seconds(
        60, completed, started, now=completed
    ) == 5


def test_autoscan_long_scan_restarts_as_soon_as_safely_possible():
    started = datetime(2026, 9, 9, 14, 30, 0, tzinfo=timezone.utc)
    completed = started + timedelta(seconds=67)

    assert autoscan_wait_seconds(
        60, completed, started, now=completed
    ) == 1
    assert autoscan_request_due(
        60, completed, started, now=completed
    ) is True


def test_autoscan_failure_keeps_existing_retry_backoff():
    last_success = datetime(2026, 9, 9, 14, 29, 0, tzinfo=timezone.utc)
    failed_attempt = datetime(2026, 9, 9, 14, 30, 0, tzinfo=timezone.utc)
    now = failed_attempt + timedelta(seconds=2)

    assert autoscan_wait_seconds(
        60, last_success, failed_attempt, retry_seconds=20, now=now
    ) == 20
    assert autoscan_request_due(
        60,
        last_success,
        failed_attempt,
        retry_seconds=20,
        now=failed_attempt + timedelta(seconds=19),
    ) is False
    assert autoscan_request_due(
        60,
        last_success,
        failed_attempt,
        retry_seconds=20,
        now=failed_attempt + timedelta(seconds=20),
    ) is True


def test_autoscan_success_request_does_not_fire_before_start_deadline():
    started = datetime(2026, 9, 9, 14, 30, 0, tzinfo=timezone.utc)
    completed = started + timedelta(seconds=50)

    assert autoscan_request_due(
        60, completed, started, now=started + timedelta(seconds=59, milliseconds=999)
    ) is False
    assert autoscan_request_due(
        60, completed, started, now=started + timedelta(seconds=60)
    ) is True


def test_live_clock_fragment_queues_scan_at_start_to_start_deadline():
    source = Path("app.py").read_text(encoding="utf-8")
    function_start = source.index("def arm_live_clock_engine(")
    function_end = source.index("\ndef _run_live_pipeline(", function_start)
    scheduler = source[function_start:function_end]

    assert "interval = autoscan_wait_seconds(" in scheduler
    assert "autoscan_request_due(" in scheduler
    assert "st.session_state[SCAN_REQUESTED_KEY] = True" in scheduler
    assert "previous < last_scan_attempt" in scheduler
'''
          if "test_autoscan_success_wait_is_measured_from_scan_start" in tests:
              raise SystemExit("GS405 regression tests already present unexpectedly")
          test_path.write_text(tests.rstrip() + append + "\n", encoding="utf-8")
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run GS405 targeted regressions
        run: python -m pytest -q tests/test_283_autoscan_lifecycle.py

      - name: Run complete test suite
        run: python -m pytest -q

      - name: Remove temporary workflow and commit verified patch
        run: |
          rm .github/workflows/gs405-apply.yml
          git config user.name "Walter GS405 Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app.py mide/session_controls.py tests/test_283_autoscan_lifecycle.py .github/workflows/gs405-apply.yml
          git diff --cached --stat
          git commit -m "GS405 enforce 60-second start-to-start autoscan cadence"
          git push origin HEAD:gs405-start-to-start-autoscan
