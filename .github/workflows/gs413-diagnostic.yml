name: GS413 Diagnostic

on:
  push:
    branches:
      - gs413-single-process-autoscan-authority

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run pytest and capture tail
        shell: bash
        run: |
          set +e
          python -m pytest -q > pytest-output.txt 2>&1
          code=$?
          tail -n 220 pytest-output.txt > pytest-tail.txt
          echo "$code" > pytest-exit-code.txt
          exit 0
      - name: Post diagnostic to PR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '## GS413 pytest diagnostic'
            echo
            echo '```text'
            cat pytest-tail.txt
            echo '```'
            echo
            echo "pytest exit code: $(cat pytest-exit-code.txt)"
          } > diagnostic-comment.md
          gh pr comment 413 --body-file diagnostic-comment.md
