name: GS413 Diagnostic

on:
  push:
    branches:
      - gs413-single-process-autoscan-authority
  pull_request:
    paths:
      - 'mide/gs413_single_process_autoscan_authority.py'
      - 'tests/test_413_single_process_autoscan_authority.py'
      - 'mide/gs392_operator_order_audio.py'
      - '.github/workflows/gs413-diagnostic.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run pytest and publish tail
        shell: bash
        run: |
          set +e
          python -m pytest -q > pytest-output.txt 2>&1
          code=$?
          echo '## GS413 pytest diagnostic' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -n 220 pytest-output.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "pytest exit code: $code" >> "$GITHUB_STEP_SUMMARY"
          exit 0
