name: GS415 Apply and Verify

on:
  push:
    branches:
      - gs415-qualified-pass-visibility

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout GS415 branch
        uses: actions/checkout@v4
        with:
          ref: gs415-qualified-pass-visibility
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Apply narrow GS415 visibility patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old!r}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "app.py",
              "from mide.flight_recorder import prefilter_decision\n",
              "from mide.flight_recorder import prefilter_decision\n"
              "from mide.gs415_qualified_pass_visibility import default_actionable_display_records\n",
          )
          replace_once(
              "app.py",
              'show_pass = st.toggle("Show removed/pass candidates", value=False)',
              'show_pass = st.toggle("Show removed candidates", value=False)',
          )
          replace_once(
              "app.py",
              'display_records = (\n'
              '    actionable_records\n'
              '    if show_pass\n'
              '    else [r for r in actionable_records if r.get("status") not in {"PASS", "Removed"}]\n'
              ')',
              'display_records = (\n'
              '    actionable_records\n'
              '    if show_pass\n'
              '    else default_actionable_display_records(actionable_records)\n'
              ')',
          )
          replace_once(
              "app.py",
              '            \'display_records = [r for r in actionable_records if r.get("status") \'\n'
              '            \'not in {"PASS", "Removed"}]\'\n',
              '            "display_records = default_actionable_display_records(actionable_records)"\n',
          )

          replace_once(
              "mide/gs407_sidebar_diagnostics_isolation.py",
              'SHOW_PASS_LABEL = "Show removed/pass candidates"',
              'SHOW_PASS_LABEL = "Show removed candidates"',
          )
          replace_once(
              "mide/gs407_sidebar_diagnostics_isolation.py",
              '* Show removed/pass candidates',
              '* Show removed candidates',
          )

          replace_once(
              "mide/flight_recorder.py",
              "from mide.trade_outcomes import TradeOutcomeStore\n",
              "from mide.trade_outcomes import TradeOutcomeStore\n"
              "from mide.gs415_qualified_pass_visibility import legacy_status_visible\n",
          )
          replace_once(
              "mide/flight_recorder.py",
              '            displayed = qualified and (record or {}).get("status") not in {\n'
              '                "PASS",\n'
              '                "Removed",\n'
              '            }',
              '            displayed = qualified and legacy_status_visible(record or {})',
          )
          replace_once(
              "mide/flight_recorder.py",
              '{"hidden_statuses": ["PASS", "Removed"]},',
              '{"hidden_statuses": ["Removed"]},',
          )
          replace_once(
              "mide/flight_recorder.py",
              '            "Displayed": sum(\n'
              '                bool(r.get("qualified_for_ranking", not scanner_v2))\n'
              '                and r.get("status") not in {"PASS", "Removed"}\n'
              '                for r in records\n'
              '            ),',
              '            "Displayed": sum(\n'
              '                bool(r.get("qualified_for_ranking", not scanner_v2))\n'
              '                and legacy_status_visible(r)\n'
              '                for r in records\n'
              '            ),',
          )
          PY

      - name: Show GS415 diff
        run: git diff --check && git diff -- app.py mide/flight_recorder.py mide/gs407_sidebar_diagnostics_isolation.py mide/gs415_qualified_pass_visibility.py tests/test_415_qualified_pass_visibility.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run GS415 targeted tests
        run: python -m pytest -q tests/test_415_qualified_pass_visibility.py tests/test_flight_recorder.py

      - name: Run full pytest suite
        run: python -m pytest -q

      - name: Commit verified GS415 patch
        run: |
          git config user.name "Walter GS415 verifier"
          git config user.email "actions@users.noreply.github.com"
          git add app.py mide/flight_recorder.py mide/gs407_sidebar_diagnostics_isolation.py mide/gs415_qualified_pass_visibility.py tests/test_415_qualified_pass_visibility.py
          git commit -m "GS415: keep qualified PASS records visible"
          git push origin HEAD:gs415-qualified-pass-visibility
