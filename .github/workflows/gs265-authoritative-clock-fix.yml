name: GS265 Authoritative Clock Fix

on:
  push:
    branches:
      - gs265-authoritative-market-clock

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gs265-authoritative-market-clock
          fetch-depth: 0
      - name: Patch browser market clock weekend logic
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app.py')
          text = path.read_text()
          old = """            const parts = new Intl.DateTimeFormat('en-US', {{\n              timeZone: 'America/New_York', hour: 'numeric', minute: '2-digit',\n              second: '2-digit', hour12: true, timeZoneName: 'short'\n            }}).formatToParts(now);\n            const value = type => parts.find(part => part.type === type)?.value || '';\n            const hour = Number(value('hour')) % 12;\n            const minute = Number(value('minute'));\n            const isPm = value('dayPeriod') === 'PM';\n            const hour24 = hour + (isPm ? 12 : 0);\n            let phase = 'Market Closed';\n            const clockMinutes = hour24 * 60 + minute;\n            if (clockMinutes >= 240 && clockMinutes < 570) phase = 'Pre-Market';\n            else if (clockMinutes >= 570 && clockMinutes < 960) phase = 'Live Market';\n            else if (clockMinutes >= 960 && clockMinutes < 1200) phase = 'After-Hours';\n"""
          new = """            const parts = new Intl.DateTimeFormat('en-US', {{\n              timeZone: 'America/New_York', weekday: 'short', hour: 'numeric', minute: '2-digit',\n              second: '2-digit', hour12: true, timeZoneName: 'short'\n            }}).formatToParts(now);\n            const value = type => parts.find(part => part.type === type)?.value || '';\n            const hour = Number(value('hour')) % 12;\n            const minute = Number(value('minute'));\n            const isPm = value('dayPeriod') === 'PM';\n            const hour24 = hour + (isPm ? 12 : 0);\n            const weekday = value('weekday');\n            const isWeekend = weekday === 'Sat' || weekday === 'Sun';\n            let phase = 'Market Closed';\n            const clockMinutes = hour24 * 60 + minute;\n            if (!isWeekend && clockMinutes >= 240 && clockMinutes < 570) phase = 'Pre-Market';\n            else if (!isWeekend && clockMinutes >= 570 && clockMinutes < 960) phase = 'Live Market';\n            else if (!isWeekend && clockMinutes >= 960 && clockMinutes < 1200) phase = 'After-Hours';\n"""
          if old not in text:
              raise SystemExit('GS265 target block not found; refusing to patch')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- app.py; then
            echo 'No app.py changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'GS265: bind browser phase to Eastern weekday clock'
          git push origin HEAD:gs265-authoritative-market-clock
